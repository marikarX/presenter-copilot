name: Bug report
description: Report a reproducible problem in Presenter Copilot
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include confidential decks, transcripts, credentials, tokens, or customer data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit SHA.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant hardware
      description: CPU/GPU/NPU and RAM if the problem involves local inference, ASR, or performance.
  - type: input
    id: backend
    attributes:
      label: AI / ASR backend
      description: Local model, Codex, API provider, ASR engine, or none.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe actual behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest reproducible sequence you can.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove secrets and private content before pasting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, private presentation content, recordings, and customer data from this report.
          required: true
