name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Windows
    runs-on: [self-hosted, windows, x64, presenter-copilot-ci]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Verify local Python and uv toolchain
        shell: pwsh
        run: |
          $pythonVersion = (& python --version 2>&1).Trim()
          if ($pythonVersion -notmatch '^Python 3\.13\.') {
            throw "Presenter Copilot's Windows runner requires Python 3.13.x; found: $pythonVersion"
          }
          uv --version

      - name: Install JavaScript dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron development runtime
        run: pnpm --filter @presenter-copilot/desktop exec electron --version

      - name: Install Python dependencies from lockfile
        run: uv sync --project core --locked

      - name: Run formatting, lint, typecheck, and tests
        run: pnpm check

      - name: Build desktop application
        run: pnpm build
