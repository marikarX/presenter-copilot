[project]
name = "presenter-core"
version = "0.1.0"
description = "Local Python core sidecar for Presenter Copilot"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastembed==0.8.0",
  "numpy==2.3.3",
  "pypdf==6.0.0",
  "python-pptx==1.0.2",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["presenter_core"]
strict = true
