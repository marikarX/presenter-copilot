[project]
name = "presenter-core"
version = "0.1.0"
description = "Local Python core sidecar for Presenter Copilot"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "av==18.1.0",
    "fastembed==0.8.0",
    "faster-whisper==1.2.1",
    "httpx>=0.27,<1",
    "lxml==6.1.2",
    "numpy==2.3.3",
    "openai==3.6.0",
    "pillow==12.3.0",
    "pyjwt[crypto]>=2.10,<3",
    "pypdf==6.19.0",
    "python-pptx==1.0.2",
    "pywin32==312; sys_platform == 'win32'",
    "sounddevice==0.5.6",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pyinstaller==6.16.0",
  "pytest==9.1.1",
  "ruff==0.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["presenter_core"]
strict = true
